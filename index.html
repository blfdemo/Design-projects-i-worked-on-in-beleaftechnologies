<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Work Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>

  <div class="scrim" id="scrim"></div>

  <!-- Sidebar (slide-in drawer on mobile, floating card on desktop) -->
  <aside id="sb" class="sidebar" aria-label="Main navigation">
    <button class="btn btn-icon btn-sm sb-close" id="sbClose" aria-label="Close menu"><svg class="i"><use href="#i-x"/></svg></button>
    <div class="brand">
      <div class="brand-mark" id="brandIcon"><svg class="i"><use href="#i-sparkle"/></svg></div><span id="brandName">Portfolio</span>
    </div>
    <div class="eyebrow nav-label">Menu</div>
    <div class="nav-scroll"><ul class="nav" id="nav"></ul></div>
    <div class="sb-foot">
      <div class="avatar" id="sbAvatar">P</div>
      <div><b id="sbName">Portfolio</b><small id="sbRole">Designer</small></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-btn" id="menuBtn" aria-label="Open menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="q" class="input" placeholder="Search all work…" aria-label="Search all work">
        <span class="kbd">/</span>
      </div>
      <button id="adminBtn" class="btn ml-auto" aria-label="Admin"><svg class="i"><use href="#i-shield"/></svg><span class="btn-label-lg">Admin</span></button>
      <button id="themeBtn" class="btn btn-icon theme-btn" aria-label="Toggle theme"></button>
    </header>

    <main id="view"></main>
    <footer id="siteFooter" class="site-footer"></footer>
  </div>

  <!-- Admin login dialog -->
  <dialog id="adminModal" aria-labelledby="adminTitle">
    <form id="adminForm" class="card dialog-card">
      <div class="row">
        <div class="ic-circle"><svg class="i"><use href="#i-lock"/></svg></div>
        <button class="btn btn-icon btn-sm ml-auto" type="button" id="adminClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div><h2 id="adminTitle">Admin login</h2><p class="muted" style="margin-top:6px">Sign in to manage your work.</p></div>
      <input id="au" class="input" placeholder="Username" autocomplete="username" required>
      <input id="ap" type="password" class="input" placeholder="Password" autocomplete="current-password" required>
      <div id="ae" class="msg er"></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in <svg class="i i-go"><use href="#i-arrow-ur"/></svg></button>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
  <script src="data/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
